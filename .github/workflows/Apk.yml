name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'prebuilt/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout private Egg repo
        uses: actions/checkout@v4
        with:           
          lfs: true
          repository: Ayaanyx7/Egg
          ssh-key: ${{ secrets.EGG_SSH_KEY }}
          path: egg-repo

      - name: Place prebuilt libspa_generated.a
        run: |
          mkdir -p prebuilt/arm64-v8a
          cp egg-repo/prebuilt/arm64-v8a/libspa_generated.a prebuilt/arm64-v8a/libspa_generated.a

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android-project
        run: ./gradlew assembleDebug -PBUILD_WITH_CMAKE=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sonic-pocket-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
