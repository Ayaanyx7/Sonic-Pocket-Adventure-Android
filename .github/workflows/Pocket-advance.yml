name: Build Sonic Pocket Adventure

on:
  workflow_dispatch:

jobs:
  build-libspa:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private Egg repo
        uses: actions/checkout@v4
        with:
          lfs: true
          repository: Ayaanyx7/Egg
          ssh-key: ${{ secrets.EGG_SSH_KEY }}
          path: egg-repo

      - name: Download rom
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: |
          curl -L "$BASEROM_URL" -o rom.ngc

      - name: Build host spa-recomp
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target spa-recomp

      - name: Generate C++ sources from ROM
        run: |
          mkdir -p build-host/generated
          ./build-host/spa-recomp \
            --rom "$PWD/rom.ngc" \
            --functions "$PWD/config/recomp/functions.txt" \
            --out "$PWD/build-host/generated"

      - name: Cross-compile libspa_generated.a (arm64-v8a)
        run: |
          cmake -S . -B build-android-lib -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O0 -DNDEBUG" \
            -DSPA_ONLY_LIB=ON \
            -DSPA_PREGENERATED_DIR="$PWD/build-host/generated"
          cmake --build build-android-lib --target spa_generated -j4

      - name: Commit libspa_generated.a to private repo
        run: |
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-debug build-android-lib/libspa_generated.a
          mkdir -p egg-repo/prebuilt/arm64-v8a
          cp build-android-lib/libspa_generated.a egg-repo/prebuilt/arm64-v8a/libspa_generated.a
          cd egg-repo
          git lfs install
          git lfs track "*.a"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitattributes prebuilt/arm64-v8a/libspa_generated.a
          git commit -m "chore: update prebuilt arm64-v8a libspa_generated.a" || echo "No changes to commit"
          git push
